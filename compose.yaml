name: doto
services:
  app:
    build: .
    restart: unless-stopped
    volumes:
      - doto_logs:/app/logs
      - doto_data:/app/data
    environment:
      PUBLIC_URL: https://${DOMAIN:?Set DOMAIN in .env}
      STUN_URLS: ${STUN_URLS:-stun:stun.l.google.com:19302}
      DOTO_ADMIN_TOKEN: ${DOTO_ADMIN_TOKEN:-}
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
volumes:
  doto_logs:
  doto_data:
  certificates:
  caddy_config:
