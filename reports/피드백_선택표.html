<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도토 피드백 선택표</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', -apple-system, sans-serif; background: #faf7f2; color: #333; padding: 24px; max-width: 900px; margin: 0 auto; }
h1 { font-size: 1.4rem; color: #5a3e28; margin-bottom: 6px; }
.subtitle { font-size: 0.85rem; color: #888; margin-bottom: 20px; }
h2 { font-size: 1.1rem; color: #7a5c3e; margin: 28px 0 12px 0; padding-bottom: 6px; border-bottom: 2px solid #e8ddd0; }
.item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 8px; margin-bottom: 6px; background: #fff; border: 1px solid #ebe3d8; transition: background 0.15s; }
.item:hover { background: #fdf8f0; }
.item input[type="checkbox"] { margin-top: 4px; width: 18px; height: 18px; accent-color: #c07830; flex-shrink: 0; cursor: pointer; }
.item label { cursor: pointer; flex: 1; }
.item .speaker { font-weight: 600; color: #7a5c3e; }
.item .quote { display: block; font-size: 0.92rem; margin-top: 2px; color: #555; }
.item .suggestion { display: block; font-size: 0.85rem; margin-top: 4px; color: #888; font-style: italic; }
.item .priority { display: inline-block; font-size: 0.75rem; padding: 2px 8px; border-radius: 4px; background: #f0e6d6; color: #7a5c3e; font-weight: 600; margin-right: 6px; }
.actions { position: sticky; bottom: 0; background: #faf7f2; padding: 16px 0; border-top: 2px solid #e8ddd0; margin-top: 20px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
button { padding: 10px 20px; border: none; border-radius: 8px; font-size: 0.95rem; cursor: pointer; font-weight: 600; }
#copyBtn { background: #c07830; color: #fff; }
#copyBtn:hover { background: #a86520; }
#selectAll { background: #e8ddd0; color: #5a3e28; }
#selectAll:hover { background: #d8cdb8; }
#deselectAll { background: #e8ddd0; color: #5a3e28; }
#deselectAll:hover { background: #d8cdb8; }
.counter { font-size: 0.85rem; color: #888; margin-left: auto; }
#output { display: none; margin-top: 16px; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 16px; font-size: 0.85rem; white-space: pre-wrap; max-height: 400px; overflow-y: auto; }
.copied-toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #5a3e28; color: #fff; padding: 10px 24px; border-radius: 8px; font-size: 0.9rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.copied-toast.show { opacity: 1; }
</style>
</head>
<body>
<h1>도토 가상수업 피드백 선택표</h1>
<p class="subtitle">수행할 항목에 체크하세요. 아래 '결과 복사' 버튼으로 정리된 텍스트를 복사할 수 있습니다.</p>

<h2>가상 교사·학생 피드백 (섹션 7)</h2>
<div id="section7"></div>

<h2>개발 우선순위 제안 (섹션 8)</h2>
<div id="section8"></div>

<div class="actions">
  <button id="selectAll" onclick="toggleAll(true)">전체 선택</button>
  <button id="deselectAll" onclick="toggleAll(false)">전체 해제</button>
  <button id="copyBtn" onclick="copyResult()">결과 복사</button>
  <span class="counter" id="counter">0 / 0 선택됨</span>
</div>

<div id="output"></div>
<div class="copied-toast" id="toast">클립보드에 복사되었습니다</div>

<script>
const feedbackItems = [
  { id: "f1", speaker: "교사", quote: "글을 안 만든 아이도 들어왔는지 알고 싶어요.", suggestion: "실제 참가자와 원고 수를 분리. '아직 시작 안 함'은 도움을 위한 표시로만 사용" },
  { id: "f2", speaker: "교사", quote: "아직 못 쓴 아이부터 보여 주세요.", suggestion: "초안·게시됨 필터와 학생이 누르는 도움 요청. 자동 성실도 점수는 불필요" },
  { id: "f3", speaker: "교사", quote: "실수로 지웠어도 돌아오니 안심돼요.", suggestion: "삭제 대상 수를 유지하고 복원 후 어떤 그룹으로 돌아갔는지 알림" },
  { id: "f4", speaker: "교사", quote: "이 링크를 아이들이 바로 열게 하고 싶어요.", suggestion: "교사가 제목 붙인 자료 링크 1-2개 제공. 학생이 긴 주소를 입력하지 않게 함" },
  { id: "f5", speaker: "하늘", quote: "글은 고쳤는데 친구도 새 글을 보고 있나요?", suggestion: "'내 원고 저장됨 / 게시판에는 이전 글이 보여요'를 구분. '게시글 업데이트'는 '고친 글 올리기'로 검토" },
  { id: "f6", speaker: "지우", quote: "이게 저장된 건지 잘 모르겠어요.", suggestion: "마지막 저장 상태를 쉬운 말로 표시하고 공개 여부와 혼동하지 않게 함" },
  { id: "f7", speaker: "서준", quote: "다 썼는데 주제를 잘못 눌렀어요.", suggestion: "첫 버전은 교사가 이동. 원고 상단 그룹 이름을 명확히 유지하고 이동 요청 통로 검토" },
  { id: "f8", speaker: "유나", quote: "이유를 더 썼는데 피드백이 아직 남아 있어요.", suggestion: "'읽었어요 / 고쳤어요' 정도의 학생 표시와 교사 확인. 상세 변경 추적은 뒤로 미룸" },
  { id: "f9", speaker: "도윤", quote: "키보드 쓰다가 게시 버튼을 어디서 찾죠?", suggestion: "글쓰기 핵심 동작을 키보드 위에서 찾기 쉽게 배치. 실제 키보드로 먼저 확인" },
  { id: "f10", speaker: "소은", quote: "첫 줄에 무슨 말을 쓰면 돼요?", suggestion: "교사가 선택하는 간단한 질문 3개 또는 시작 문장. 완성 답안 자동 생성은 불필요" },
  { id: "f11", speaker: "조사 수업 학생", quote: "출처에는 주소를 다 써야 해요?", suggestion: "기관/자료 제목/날짜의 짧은 입력 틀, 링크는 선택 입력" },
  { id: "f12", speaker: "조사 수업 학생", quote: "글만 보니까 거중기 모양을 모르겠어요.", suggestion: "우선 교사 화면·자료 카드로 그림 제공. 학생 이미지 업로드는 후속 검토" },
];

const priorityItems = [
  { id: "p1", priority: "실제 수업 전 필수", title: "교사·학생 직접 연결, 권한 확인, 재접속·원고 보관", criteria: "PC와 실제 태블릿 두 대에서 서로 다른 원고를 쓰고 재접속해 자기 글만 이어 씀" },
  { id: "p2", priority: "실제 수업 전 필수", title: "Android 화면 키보드·한글 조합·터치 확인", criteria: "제목→본문→서식→피드백→수정→게시를 실제 키보드로 수행. 입력 손실·커서 점프가 없어야 함" },
  { id: "p3", priority: "UI 다음 차례 1", title: "저장·공개본 상태와 쉬운 게시 버튼 이름", criteria: "아이가 '나에게 저장됐는지/친구에게 보이는지'를 설명할 수 있음" },
  { id: "p4", priority: "UI 다음 차례 2", title: "키보드 사용 중 핵심 동작 접근", criteria: "키보드가 열린 상태에서 현재 문장과 글 올리기 동작을 찾기 쉬움" },
  { id: "p5", priority: "UI 다음 차례 3", title: "도움 요청·초안/게시 필터·피드백 확인", criteria: "교사가 손든 학생·초안·피드백 반영 여부를 몇 번의 클릭으로 구분" },
  { id: "p6", priority: "수업 지원 1", title: "선택형 글쓰기 틀과 출처 칸", criteria: "서평/조사 글의 시작을 돕되 학생 생각을 대신 써 주지 않음" },
  { id: "p7", priority: "수업 지원 2", title: "교사 자료 링크·그림 카드", criteria: "학생이 긴 주소를 입력하거나 여러 검색 탭 사이를 헤매지 않음" },
  { id: "p8", priority: "나중에 검토", title: "학생 이미지 첨부·수업 템플릿 복제", criteria: "첫 수업의 입력·연결 문제를 해결한 뒤 현장 필요로 결정" },
];

function renderSection7() {
  const container = document.getElementById('section7');
  feedbackItems.forEach(item => {
    container.innerHTML += `
      <div class="item">
        <input type="checkbox" id="${item.id}" onchange="updateCounter()">
        <label for="${item.id}">
          <span class="speaker">${item.speaker}</span>
          <span class="quote">"${item.quote}"</span>
          <span class="suggestion">→ ${item.suggestion}</span>
        </label>
      </div>`;
  });
}

function renderSection8() {
  const container = document.getElementById('section8');
  priorityItems.forEach(item => {
    container.innerHTML += `
      <div class="item">
        <input type="checkbox" id="${item.id}" onchange="updateCounter()">
        <label for="${item.id}">
          <span class="priority">${item.priority}</span>
          <span class="speaker">${item.title}</span>
          <span class="quote">${item.criteria}</span>
        </label>
      </div>`;
  });
}

function updateCounter() {
  const all = document.querySelectorAll('input[type="checkbox"]');
  const checked = document.querySelectorAll('input[type="checkbox"]:checked');
  document.getElementById('counter').textContent = `${checked.length} / ${all.length} 선택됨`;
}

function toggleAll(state) {
  document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = state);
  updateCounter();
}

function copyResult() {
  let lines = [];
  lines.push("# 도토 피드백 수행 선택 결과");
  lines.push("");
  lines.push("## 가상 교사·학생 피드백");
  lines.push("");
  feedbackItems.forEach(item => {
    const checked = document.getElementById(item.id).checked;
    const status = checked ? "✅ 수행" : "⬜ 수행하지 않음";
    lines.push(`${status} | ${item.speaker}: "${item.quote}"`);
    lines.push(`  → ${item.suggestion}`);
  });
  lines.push("");
  lines.push("## 개발 우선순위 제안");
  lines.push("");
  priorityItems.forEach(item => {
    const checked = document.getElementById(item.id).checked;
    const status = checked ? "✅ 수행" : "⬜ 수행하지 않음";
    lines.push(`${status} | [${item.priority}] ${item.title}`);
    lines.push(`  기준: ${item.criteria}`);
  });

  const text = lines.join("\n");
  const outputEl = document.getElementById('output');
  outputEl.style.display = 'block';
  outputEl.textContent = text;

  navigator.clipboard.writeText(text).then(() => {
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  }).catch(() => {
    // fallback: select the output text
    const range = document.createRange();
    range.selectNodeContents(outputEl);
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
  });
}

renderSection7();
renderSection8();
updateCounter();
</script>
</body>
</html>
